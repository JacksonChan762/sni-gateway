services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sni_gateway
      POSTGRES_USER: sni
      POSTGRES_PASSWORD: sni_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sni -d sni_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sni-net

  backend:
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sni:sni_secret@postgres:5432/sni_gateway?sslmode=disable
      PORT: 8080
      ROUTE_SNAPSHOT_PATH: /var/lib/sni-gateway/routes.json
      DOCKER_SOCKET: /var/run/docker.sock
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      EXIT_RESTART_CRON: "${EXIT_RESTART_CRON:-@every 12h}"
      WIREGUARD_DDNS_CHECK_INTERVAL: "${WIREGUARD_DDNS_CHECK_INTERVAL:-30s}"
      TLS_IDLE_TIMEOUT: "${TLS_IDLE_TIMEOUT:-5m}"
      TLS_MAX_CONNECTIONS: "${TLS_MAX_CONNECTIONS:-2048}"
      PROVIDER_CATALOG_PATH: /var/lib/sni-gateway/providers.json.gz
      PROVIDER_CATALOG_UPDATE_INTERVAL: "${PROVIDER_CATALOG_UPDATE_INTERVAL:-24h}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - published_routes:/var/lib/sni-gateway
    ports:
      - "127.0.0.1:8080:8080"
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sni-net
      - vpn-net

volumes:
  postgres_data:
  published_routes:

networks:
  sni-net:
    driver: bridge
  vpn-net:
    driver: bridge
    name: vpn-net
