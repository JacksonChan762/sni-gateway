services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sni_gateway
      POSTGRES_USER: sni
      POSTGRES_PASSWORD: sni_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sni -d sni_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sni-net

  relay-image:
    image: sni-gateway-relay:latest
    build:
      context: ./relay
      dockerfile: Dockerfile
    command: ["/bin/sh", "-c", "sleep infinity"]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      relay-image:
        condition: service_started
    environment:
      DATABASE_URL: postgres://sni:sni_secret@postgres:5432/sni_gateway?sslmode=disable
      PORT: 8080
      NGINX_CONFIG_DIR: /etc/nginx/conf.d
      DOCKER_SOCKET: /var/run/docker.sock
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      EXIT_RESTART_CRON: "${EXIT_RESTART_CRON:-@every 12h}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_conf:/etc/nginx/conf.d
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - sni-net

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_conf:/etc/nginx/conf.d
    ports:
      - "80:80"
      - "443:443"
    networks:
      - sni-net
      - vpn-net

volumes:
  postgres_data:
  nginx_conf:

networks:
  sni-net:
    driver: bridge
  vpn-net:
    driver: bridge
    name: vpn-net
