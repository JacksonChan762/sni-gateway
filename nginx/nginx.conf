user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

stream {
    # Generated SNI map and stream upstreams
    include /etc/nginx/conf.d/sni_stream.conf;

    # TLS passthrough based on SNI
    server {
        listen 443;
        ssl_preread on;

        # Docker's embedded DNS — resolves gluetun-{name} at connect time
        # so stopped exit containers don't break nginx startup or config reload
        resolver 127.0.0.11 valid=10s;

        proxy_pass $tls_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" host=$http_host backend=$http_backend';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Generated HTTP map and upstreams
    include /etc/nginx/conf.d/sni_http.conf;

    # HTTP proxy based on Host header
    server {
        listen 80;

        # Docker's embedded DNS — resolves gluetun-{name} at request time
        resolver 127.0.0.11 valid=10s;

        location / {
            proxy_pass http://$http_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
        }
    }
}
